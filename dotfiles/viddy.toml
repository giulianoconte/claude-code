# viddy config — read from ~/.config/viddy.toml (verified: this is the path
# v1.3.0 actually loads; the binary's "Config directory: ~/.config/viddy"
# banner is misleading).
#
# Only deviation from viddy's defaults: half-page scroll is bound to bare
# d/u (like less) instead of Ctrl-d/Ctrl-u. The full keymap is listed
# verbatim so that if viddy replaces (rather than merges) the keymap when
# this section is present, every other binding still works.

[keymap]
timemachine_go_to_past = "Down"
timemachine_go_to_more_past = "Shift-Down"
timemachine_go_to_future = "Up"
timemachine_go_to_more_future = "Shift-Up"
timemachine_go_to_now = "Ctrl-Shift-Up"
timemachine_go_to_oldest = "Ctrl-Shift-Down"
scroll_left = "h"
scroll_right = "l"
scroll_up = "k"
scroll_down = "j"
scroll_half_page_up = "u"
scroll_half_page_down = "d"
scroll_page_up = "Ctrl-b"
scroll_page_down = "Ctrl-f"
scroll_bottom_of_page = "Shift-g"
scroll_top_of_page = "g g"
