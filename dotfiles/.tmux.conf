########################
# BASIC BEHAVIOR
########################

# Mouse: click panes, scroll, resize
set -g mouse on

# Extended keys (CSI u) — required for Shift+Enter over tmux.
# NOTE: extended-keys is a SERVER option, use -s (not -g), or it's ignored.
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

########################
# NUMBERING (LESS CONFUSION)
########################

# Start window numbering at 1 instead of 0
set -g base-index 1

# Start pane numbering at 1
setw -g pane-base-index 1

# Show pane numbers for longer
set -g display-panes-time 2000

########################
# PANE VISUALS
########################

# Inactive pane borders (subtle) — bg matches inactive pane bg so seams disappear
set -g pane-border-style fg=colour94,bg=colour236

# Active pane border (highlighted) — bg matches inactive pane bg for visual continuity
set -g pane-active-border-style fg=colour154,bg=colour236,bold

# Dim inactive panes: lighter bg drops contrast so unfocused content reads as washed out.
# Active uses `bg=terminal` (the actual terminal emulator bg) — `bg=default` would
# inherit from window-style and end up matching the inactive grey.
set -g window-style bg=colour236
set -g window-active-style bg=terminal

########################
# STATUS BAR
########################

# Turn status bar on
set -g status on

# Refresh every 2 seconds
set -g status-interval 2

# Style (minimal)
set -g status-style bg=default,fg=colour245

# Left side: session name
set -g status-left "#[fg=colour81] #S "

# Right side: time
set -g status-right "#[fg=colour245]%H:%M "

########################
# KEYBINDS (QUALITY OF LIFE)
########################

# Easier split keys
bind | split-window -h
bind - split-window -v

# Reload config quickly
bind r source-file ~/.tmux.conf \; display "Reloaded!"

########################
# COPY MODE (SCROLLING)
########################

# Use vi-style navigation (much better)
setw -g mode-keys vi

# Scroll history
set -g history-limit 10000


